# Release builds of the arita CLI.
# Tag push (v*): GitHub Release with prebuilt binaries + SHA256SUMS.txt.
# workflow_dispatch: same builds uploaded as workflow artifacts only (no Release).
#
# Runner labels (standard GitHub-hosted runners for public repositories, 2026):
#   ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-11-arm
#   https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job
#   https://github.blog/changelog/2025-08-07-arm64-hosted-runners-for-public-repositories-are-now-generally-available/
#   https://github.com/actions/runner-images
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.triple }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            pack: tar.gz
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            pack: tar.gz
          - runner: windows-2022
            triple: x86_64-pc-windows-msvc
            pack: zip
          - runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
            pack: zip
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust 1.97.1
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-10-01
        with:
          toolchain: 1.97.1

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE="${{ matrix.triple }}"
          PACK="${{ matrix.pack }}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="v0.1.1"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          case "$VERSION" in
            v*) ;;
            *) echo "ref name must look like v*, got ${VERSION}" >&2; exit 1 ;;
          esac
          rustup target add "$TRIPLE"
          cargo build --release --locked -p arita-cli --target "$TRIPLE"
          STAGE="${RUNNER_TEMP}/arita-stage"
          rm -rf "$STAGE"
          # pwd is a Unix path even on Windows runners. GITHUB_WORKSPACE is
          # D:\... there, and bsdtar treats "D:" in -f as a remote host.
          ROOT="$(pwd)"
          mkdir -p "$STAGE" "${ROOT}/dist"
          REL="target/${TRIPLE}/release"
          if [ "$PACK" = "zip" ]; then
            cp "${REL}/arita.exe" "$STAGE/arita.exe"
            BINNAME="arita.exe"
          else
            cp "${REL}/arita" "$STAGE/arita"
            chmod 755 "$STAGE/arita"
            BINNAME="arita"
          fi
          cp LICENSE NOTICE README.md README.es.md "$STAGE/"
          # Absolute -f so -C does not make the archive path relative to the stage dir.
          OUT="${ROOT}/dist/arita-${VERSION}-${TRIPLE}.${PACK}"
          if [ "$PACK" = "tar.gz" ]; then
            tar -C "$STAGE" -czf "$OUT" "$BINNAME" LICENSE NOTICE README.md README.es.md
            tar -tzf "$OUT"
          else
            tar -C "$STAGE" -a -cf "$OUT" "$BINNAME" LICENSE NOTICE README.md README.es.md
            tar -tf "$OUT"
          fi
          # upload-artifact on Windows does not accept a Git-bash /d/ path.
          echo "ASSET_PATH=dist/arita-${VERSION}-${TRIPLE}.${PACK}" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error
          compression-level: 0

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: arita-*
          path: artifacts
          merge-multiple: true

      - name: Write SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          # Only the release archives; this file is not hashed into itself.
          sha256sum arita-* | tee SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error
          archive: false
          compression-level: 0

  publish:
    name: GitHub Release
    needs: checksums
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES=".github/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "missing release notes: ${NOTES}" >&2
            exit 1
          fi
          cd dist
          sha256sum -c SHA256SUMS.txt
          cd ..
          # Not a draft and not a prerelease.
          gh release create "$TAG" \
            --title "ARITA ${TAG}" \
            --notes-file "$NOTES" \
            dist/arita-* \
            dist/SHA256SUMS.txt
