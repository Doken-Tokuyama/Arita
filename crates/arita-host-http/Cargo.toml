[package]
name = "arita-host-http"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "ADR-245 curated HTTP server bindings (Core 0.2 slice 4) — host border"

[dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "net", "time", "sync", "io-util", "process"] }
hyper = { version = "=1.6.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.16", features = ["tokio", "server-auto", "http1"] }
http-body-util = "=0.1.3"
http = "=1.3.1"
bytes = "=1.12.1"
serde_json = "1"
