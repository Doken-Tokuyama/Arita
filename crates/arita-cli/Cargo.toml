[package]
name = "arita-cli"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "arita"
path = "src/main.rs"

[dependencies]
arita-syntax = { path = "../arita-syntax" }
arita-codegen = { path = "../arita-codegen" }
arita-hir = { path = "../arita-hir" }
arita-logic = { path = "../arita-logic" }
sha2 = "0.11.0"
lsp-server = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
